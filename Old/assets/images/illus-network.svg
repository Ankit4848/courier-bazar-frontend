<svg viewBox="0 0 820 700" width="820" height="700" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A hub and spoke network connecting Courier Bazar to many courier partners across cities">
  <defs>
    <linearGradient id="nbg" x1="0" y1="0" x2="820" y2="700" gradientUnits="userSpaceOnUse"><stop stop-color="#f7f3ea"></stop><stop offset="1" stop-color="#efe9db"></stop></linearGradient>
    <linearGradient id="nb" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2a251c"></stop><stop offset="1" stop-color="#6b5c45"></stop></linearGradient>
    <linearGradient id="nm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6f8a5f"></stop><stop offset="1" stop-color="#4f7a53"></stop></linearGradient>
    <filter id="nsh" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#2a2416" flood-opacity="0.16"></feDropShadow></filter>
  </defs>
  <rect width="820" height="700" rx="28" fill="url(#nbg)"></rect>
  <circle cx="140" cy="580" r="140" fill="#16130d" opacity="0.07"></circle>
  <circle cx="690" cy="130" r="150" fill="#6b5c45" opacity="0.07"></circle>

  
  <g stroke="url(#nb)" stroke-width="2.5" opacity="0.4">
    <line x1="410" y1="350" x2="160" y2="150"></line>
    <line x1="410" y1="350" x2="660" y2="150"></line>
    <line x1="410" y1="350" x2="130" y2="360"></line>
    <line x1="410" y1="350" x2="690" y2="360"></line>
    <line x1="410" y1="350" x2="200" y2="560"></line>
    <line x1="410" y1="350" x2="620" y2="560"></line>
  </g>

  
  <g filter="url(#nsh)" font-family="Space Grotesk, Arial, sans-serif" font-weight="700">
    <g><circle cx="160" cy="150" r="42" fill="#fff"></circle><rect x="140" y="142" width="40" height="16" rx="4" fill="url(#nb)"></rect></g>
    <g><circle cx="660" cy="150" r="42" fill="#fff"></circle><circle cx="660" cy="150" r="16" fill="none" stroke="#6b5c45" stroke-width="5"></circle></g>
    <g><circle cx="130" cy="360" r="42" fill="#fff"></circle><path d="M112 372 h36 v-20 l-18 -10 l-18 10 z" fill="url(#nm)"></path></g>
    <g><circle cx="690" cy="360" r="42" fill="#fff"></circle><rect x="672" y="344" width="36" height="32" rx="6" fill="url(#nb)"></rect><rect x="678" y="352" width="24" height="6" rx="3" fill="#fff"></rect></g>
    <g><circle cx="200" cy="560" r="42" fill="#fff"></circle><path d="M184 548 l16 -8 l16 8 v20 a4 4 0 0 1 -4 4 h-24 a4 4 0 0 1 -4 -4 z" fill="url(#nb)"></path></g>
    <g><circle cx="620" cy="560" r="42" fill="#fff"></circle><circle cx="620" cy="552" r="12" fill="none" stroke="#4f7a53" stroke-width="5"></circle><rect x="616" y="562" width="8" height="16" rx="4" fill="#4f7a53"></rect></g>
  </g>

  
  <g filter="url(#nsh)">
    <circle cx="410" cy="350" r="88" fill="url(#nb)"></circle>
    <circle cx="410" cy="350" r="88" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="2"></circle>
  </g>
  <text x="410" y="372" font-family="Space Grotesk, Arial, sans-serif" font-size="58" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="-2">CB</text>

  
  <circle cx="410" cy="350" r="112" fill="none" stroke="#16130d" stroke-width="2" opacity="0.22"></circle>
  <circle cx="410" cy="350" r="140" fill="none" stroke="#16130d" stroke-width="1.5" opacity="0.12"></circle>
